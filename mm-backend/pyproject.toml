[project]
name = "vm-backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "google-api-python-client>=2.199.0",
    "isodate>=0.7.2",
    "openai>=3.3.1",
    "psycopg[binary]>=3.3.4",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "sqlmodel>=0.0.39",
]

[dependency-groups]
dev = [
    "alembic>=1.19.1",
    "locust>=2.46.4",
]
